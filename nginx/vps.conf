# HTTPS - apenas dominio (Let\'s Encrypt)
server {
  listen       8445 ssl http2;
  server_name  de.checker.mobi *.de.checker.mobi;
  root   /home/vps/public_html;

  ssl_certificate     /etc/xray/xray-fullchain.crt;
  ssl_certificate_key /etc/xray/xray-le.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  access_log /var/log/nginx/vps-ssl-access.log;
  error_log  /var/log/nginx/vps-ssl-error.log error;

  location = / {
    index index.html;
  }

  location ~* \.(ovpn|txt|zip|sh|conf)$ {
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment' always;
    add_header Cache-Control 'no-store' always;
  }

  location / {
    try_files $uri =404;
  }
}

# HTTP:89 -> HTTPS redirect
server {
  listen       89;
  server_name  _;
  return 301 https://de.checker.mobi:8445\$request_uri;
}
